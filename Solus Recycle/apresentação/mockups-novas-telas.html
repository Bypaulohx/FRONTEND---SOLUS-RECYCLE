<script>
function nav(active, labels) {
  const centers = [39,117,195,273,351];
  const icons = ['i-home','i-map','i-chat','i-recycle','i-cal'];
  let s = '<rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/><line x1="0" y1="772" x2="390" y2="772" stroke="#F1F1F1" stroke-width="1"/>';
  for (let i=0;i<5;i++) {
    const c = centers[i], on = i===active;
    s += '<g opacity="'+(on?'1':'.65')+'"><use href="#'+icons[i]+'" x="'+(c-11)+'" y="790" width="22" height="22"'+(on?' style="stroke:#149C68"':'')+'/>';
    s += '<text x="'+c+'" y="833" text-anchor="middle" font-size="10" font-weight="'+(on?'700':'500')+'" fill="'+(on?'#149C68':'#ADADAD')+'">'+labels[i]+'</text></g>';
  }
  return s;
}
</script>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  function S(tag, attrs, text) {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, String(value)));
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function add(parent, child) { parent.appendChild(child); return child; }

  function buildNav(screenId, active) {
    const svg = document.getElementById(screenId);
    const g = add(svg, S('g'));
    add(g, S('rect', { x: 0, y: 772, width: 390, height: 72, fill: '#FFFFFF' }));
    add(g, S('line', { x1: 0, y1: 772, x2: 390, y2: 772, stroke: '#F1F1F1', 'stroke-width': 1 }));
    const centers = [39, 117, 195, 273, 351];
    const icons = ['i-home', 'i-map', 'i-chat', 'i-recycle', 'i-cal'];
    const labels = ['Início', 'Mapa', 'Conversas', 'Reciclagem', 'Agenda'];
    centers.forEach((c, i) => {
      const on = i === active;
      const color = on ? '#149C68' : '#ADADAD';
      const item = add(g, S('g', { opacity: on ? '1' : '.65' }));
      add(item, S('use', { href: '#' + icons[i], x: c - 11, y: 790, width: 22, height: 22, style: 'color:' + color }));
      add(item, S('text', {
        x: c, y: 833, 'text-anchor': 'middle', 'font-size': 10,
        'font-weight': on ? 700 : 500, fill: color
      }, labels[i]));
    });
  }

  function buildDecisoes() {
    const g = document.getElementById('decisoes');
    const dados = [
      ['MS', 'Maria S.', 'Papel e plástico · 4 kg', 'Av. Paulista, 1000'],
      ['JP', 'João P.', 'Eletrônicos · 8 kg', 'Rua Augusta, 420'],
      ['AR', 'Ana R.', 'Vidro · 5 kg', 'Rua Consolação, 900']
    ];
    dados.forEach((d, i) => {
      const y = 206 + i * 94;
      add(g, S('rect', { x: 20, y, width: 350, height: 86, rx: 10, fill: '#fff', stroke: '#F1F1F1' }));
      add(g, S('circle', { cx: 48, cy: y + 31, r: 17, fill: '#E8F7EC' }));
      add(g, S('text', { x: 48, y: y + 35, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 700, fill: '#149C68' }, d[0]));
      add(g, S('text', { x: 76, y: y + 27, class: 'tb t', 'font-size': 13 }, d[1]));
      add(g, S('text', { x: 76, y: y + 45, class: 'tl m' }, d[2]));
      add(g, S('text', { x: 76, y: y + 63, class: 'tl m' }, d[3]));
      add(g, S('rect', { x: 252, y: y + 48, width: 56, height: 28, rx: 8, fill: '#38C958' }));
      add(g, S('text', { x: 280, y: y + 66, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700, fill: '#fff' }, 'Receber'));
      add(g, S('rect', { x: 314, y: y + 48, width: 52, height: 28, rx: 8, fill: '#fff', stroke: '#38C958' }));
      add(g, S('text', { x: 340, y: y + 66, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700, fill: '#149C68' }, 'Buscar'));
    });
  }

  function buildLinhaAgenda() {
    const g = document.getElementById('linhaagenda');
    const itens = [
      ['09:30', 'Maria S.', 'Papel 4 kg · Confirmada', '#149C68'],
      ['11:00', 'João P.', 'Eletrônicos 8 kg · Em rota', '#38C958'],
      ['14:00', 'Coop. Vitória', 'Vidro 12 kg · Recebida', '#149C68'],
      ['16:30', 'Ana R.', 'Plástico 3 kg · Aguardando', '#ADADAD']
    ];
    itens.forEach((d, i) => {
      const y = 164 + i * 73;
      const selected = i === 1;
      add(g, S('rect', { x: 20, y, width: 350, height: 64, rx: 10, fill: selected ? '#F4FAF5' : '#fff', stroke: selected ? '#38C958' : '#F1F1F1' }));
      add(g, S('circle', { cx: 44, cy: y + 32, r: 14, fill: selected ? '#38C958' : '#F4FAF5' }));
      add(g, S('text', { x: 44, y: y + 36, 'text-anchor': 'middle', 'font-size': 9, 'font-weight': 700, fill: selected ? '#fff' : '#149C68' }, d[0].slice(0, 2)));
      add(g, S('text', { x: 70, y: y + 27, class: 'tb t', 'font-size': 12 }, d[0] + ' · ' + d[1]));
      add(g, S('text', { x: 70, y: y + 46, class: 'tl m' }, d[2]));
      add(g, S('circle', { cx: 350, cy: y + 32, r: 4, fill: d[3] }));
    });
  }

  buildDecisoes();
  buildLinhaAgenda();
  buildNav('dashboard', 0);

  buildNav('conversas', 2);
  buildNav('qrusuario', 0);
  buildNav('escanear', 4);
  buildNav('recompensas', 3);
})();
